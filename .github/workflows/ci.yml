name: Linux Platform CI

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**', 'wave/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test Platform & Build (Ubuntu / Bun v1.4.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Revision
        uses: actions/checkout@v4

      - name: Setup Pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Verify Lockfile and Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter
        run: bun run lint

      - name: Run Comprehensive Platform Test Suite
        run: bun run test:platform

      - name: Run Isolated Production Build
        run: bun run build
